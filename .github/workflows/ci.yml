name: offline-snapshot-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/tmp
      TMP: ${{ github.workspace }}/Build/tmp
      TEMP: ${{ github.workspace }}/Build/tmp
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - name: Create ASCII temporary path under Build
        run: python3 -c "from pathlib import Path; Path('Build/tmp').mkdir(parents=True, exist_ok=True)"
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
